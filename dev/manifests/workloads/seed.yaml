apiVersion: v1
kind: Namespace
metadata:
  name: workload-test
  annotations:
    opencost.io/test: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: workload-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
      annotations:
        opencost.io/pod: "seed"
    spec:
      containers:
      - name: nginx
        image: nginx:stable
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
  namespace: workload-test
spec:
  serviceName: web
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
      annotations:
        opencost.io/pod: "stateful"
    spec:
      containers:
      - name: nginx
        image: nginx:stable
        resources:
          requests:
            cpu: 50m
            memory: 64Mi